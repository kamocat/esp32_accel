<!DOCTYPE html>
<html><head>
<style>
button{
	width: 40%;
	padding: 1em;
}
input{
	width:40%;
}
label{
	width:49%;
}
#autorange{
	width:100%;
}
#sidebar{
	float:right;
	width: 20%;
}
</style>
<link rel="stylesheet" href="/static/uPlot/dist/uPlot.min.css">
<script src="/static/uPlot/dist/uPlot.iife.min.js"></script>
</head>
<body>
<div id="sidebar">
<h2>Stats</h2>
<p id="stats"></p>
<h2>Settings</h2>
<label for="n_hist">Chart length</label>
<input type="number" id="n_hist" name="n_hist" min="500" max="50000" step="500" value="2000"><br>
<label for="dlpf_cfg">Filter / Sample rate</label>
<select id="dlpf_cfg">
  <option value="0">260 Hz / 1000 sps</option>
  <option value="1">184 Hz / 1000 sps</option>
  <option value="2">94 Hz / 500 sps</option>
  <option value="3" selected>44 Hz / 200 sps</option>
  <option value="4">21 Hz / 100 sps</option>
  <option value="5">10 Hz / 50 sps</option>
  <option value="6">5 Hz / 25 sps</option>
</select><br>
<label for="afs_sel">Accel scale</label>
<select id="afs_sel">
  <option value="0" selected>&#177;2 G</option>
  <option value="1">&#177;4 G</option>
  <option value="2">&#177;8 G</option>
  <option value="3">&#177;16 G</option>
</select><br>
<button onclick="applySettings()">Apply</button>
<h2>Export</h2>
<button onclick="save_recording()">Save CSV</button>
<ul id="dl"></ul>
</div>
<div id="chart1"></div>
<script src="/static/liveplot.js"></script>
</body></html>
